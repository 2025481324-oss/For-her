<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        /* CSS INTEGRATED FOR FAIL-SAFE LOADING */
        body {
            background: linear-gradient(135deg, #fffafb 0%, #ffebf0 100%);
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        .header-container {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
        }

        .header-img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            width: 90%;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .main-gif {
            width: 180px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h2 { color: #ff8da1; font-size: 20px; line-height: 1.4; }
        h3 { color: #555; font-size: 18px; line-height: 1.6; padding: 0 10px; }

        .instruction { font-style: italic; color: #aaa; font-size: 14px; margin-bottom: 20px; }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .yes-btn { background-color: #ffb6c1; color: white; width: 85%; }
        .no-btn { background-color: #f0f0f0; color: #888; width: 85%; }

        .cat-btn {
            background-color: #ffffff;
            border: 2px solid #ffb6c1;
            color: #ff8da1;
            width: 85%;
            display: block;
            margin: 10px auto;
        }

        .cat-btn:hover { background-color: #ffb6c1; color: white; }

        .refresh-btn { background-color: #add8e6; color: white; margin-top: 15px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="header-container">
        <img src="header.jpg" alt="Header" class="header-img">
    </div>

    <div class="container">
        <div class="card">
            
            <div id="question-state">
                <img src="d1.gif" alt="Cute GIF" class="main-gif">
                <h2>Are you feeling a bit sad or overthinking right now?</h2>
                <div class="button-group">
                    <button id="yesBtn" class="btn yes-btn">Yes, a little..</button>
                    <button id="noBtn" class="btn no-btn">No, I'm okay!</button>
                </div>
            </div>

            <div id="category-state" class="hidden">
                <img src="d3.gif" alt="Category GIF" class="main-gif">
                <p class="instruction">What does your heart need right now?</p>
                <button class="btn cat-btn" onclick="showSpecific('stressed')">💡 I'm Stressed</button>
                <button class="btn cat-btn" onclick="showSpecific('loved')">❤️ I need to feel loved</button>
                <button class="btn cat-btn" onclick="showSpecific('insecure')">✨ I'm feeling insecure</button>
            </div>

            <div id="final-message-area" class="hidden">
                <img src="d4.gif" alt="Final GIF" class="main-gif">
                <h3 id="message"></h3>
                <button class="btn refresh-btn" onclick="resetCategories()">Give me another hug</button>
            </div>

        </div>
    </div>

    <script>
        // Use Window Load to ensure all elements exist before running JS
        window.onload = function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const audio = document.getElementById('bg-music');

            let yesSize = 1;

            // Start music on first click anywhere
            document.addEventListener('click', function() {
                audio.play();
            }, { once: true });

            // No Button Prank
            noBtn.addEventListener('click', function() {
                yesSize += 0.5;
                yesBtn.style.transform = `scale(${yesSize})`;
                const phrases = ["Are you sure?", "Really??", "Don't lie!", "Look at the pink button!", "You're overthinking!!"];
                noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            });

            // Yes Button Logic
            yesBtn.addEventListener('click', function() {
                document.getElementById('question-state').classList.add('hidden');
                document.getElementById('category-state').classList.remove('hidden');
            });
        };

        const library = {
            stressed: [
                "Whatever is on your plate right now, we’re sharing it. I’m on your team, and we’re going to get through this day together.",
                "Take a deep breath. You don’t have to be perfect for me to be completely in love with you.",
                "I see how hard you’re working, and I’m so proud of you. I’ve got your back, always."
            ],
            loved: [
                "Just a reminder: out of everyone in the world, I’d still choose you every single time.",
                "You are the best part of my day, my favorite person to talk to, and my home. I love you exactly as you are.",
                "I know life gets loud sometimes, but you are the only thing that matters to me. I’m not going anywhere."
            ],
            insecure: [
                "You are more than enough. In fact, you’re more than I ever hoped for.",
                "I don't just love you; I genuinely admire you. You're beautiful, capable, and you're mine.",
                "If you could see yourself through my eyes for just one minute, you’d never doubt how incredible you are again."
            ]
        };

        function showSpecific(category) {
            document.getElementById('category-state').classList.add('hidden');
            document.getElementById('final-message-area').classList.remove('hidden');
            const options = library[category];
            document.getElementById('message').innerText = options[Math.floor(Math.random() * options.length)];
        }

        function resetCategories() {
            document.getElementById('final-message-area').classList.add('hidden');
            document.getElementById('category-state').classList.remove('hidden');
        }
    </script>
</body>
</html>
